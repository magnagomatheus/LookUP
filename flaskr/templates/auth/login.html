{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block content %}
    <div class="container min-vh-100 d-flex flex-column justify-content-center text-center pw-5">
        <h2 class="mb-5 fw-bold">Login</h2>
    
        <form method="post" action="{{url_for('auth.login')}}">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail:</label>
                <input type="text" class="form-control mx-auto w-50" id="email" name="email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" class="form-control mx-auto w-50 text-start" id="password" name="password">
            </div>
            <button type="submit" class="btn btn-primary mt-3">Log In</button>
        </form>
    </div>
{% endblock %}
