<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>

        <title>{%block title%}{%endblock%}</title>
    </head>
    <body>
        <nav id="navbar" class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid d-flex justify-content-start gap-3">
                <a class="nav-link" href="{{url_for('core.index')}}">Home</a>
            </div>
            <div class="container-fluid d-flex justify-content-end align-items-center gap-3">
                {% if g.user %}
                    <span class="navbar-text fw-bold me-2">{{g.user['username']}}</span>
                    <a class="nav-link" href="{{url_for('core.saveAddress')}}">Save New Address</a>
                    <a class="nav-link" href="{{url_for('auth.logout')}}">Log Out</a>
                {% else %}
                    <a class="nav-link" href="{{url_for('auth.register')}}">Register</a>
                    <a class="nav-link" href="{{url_for('auth.login')}}">Log In</a>
                {%endif%}
            </div>
            
        </nav>

        <section class="content">
            {% for message in get_flashed_messages() %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
            
            {% block content %}{% endblock %}
        </section>
    </body>
</html>
